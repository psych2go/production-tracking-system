<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>生产进度追踪</title>
    <!--preload-links-->
    <!--app-context-->
    <style>
      /*
        Layout (bottom → top of stack visually):
          ICP footer (very bottom) → tabBar (raised) → page content
        ICP never covers tabBar tap targets.
      */
      :root {
        --icp-h: 36px;
      }
      body {
        padding-bottom: var(--icp-h);
      }
      .icp-beian {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 901;
        height: var(--icp-h);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        box-sizing: border-box;
        font-size: 12px;
        line-height: 1.4;
        color: #7d898b;
        background: #f1f4f3;
        border-top: 1px solid #e3e9e7;
        pointer-events: none;
      }
      .icp-beian a {
        color: #7d898b;
        text-decoration: none;
        pointer-events: auto;
      }
      /* Keep uni-app tabBar ABOVE the ICP strip (not overlapping it) */
      .uni-tabbar,
      .uni-tabbar-bottom,
      uni-tabbar {
        bottom: var(--icp-h) !important;
      }
    </style>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <!-- Global ICP: always at page bottom; tabBar is lifted above this strip -->
    <footer id="icp-beian" class="icp-beian" aria-label="ICP备案">
      <a
        href="https://beian.miit.gov.cn/"
        target="_blank"
        rel="noopener noreferrer"
      >陕ICP备2026009527号-1</a>
    </footer>
    <script>
      (function () {
        var TAB_SEL = ".uni-tabbar, .uni-tabbar-bottom, uni-tabbar";
        function visibleTabs() {
          var out = [];
          var nodes = document.querySelectorAll(TAB_SEL);
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            var st = window.getComputedStyle(el);
            if (st.display === "none" || st.visibility === "hidden") continue;
            if (el.offsetHeight > 0) out.push(el);
          }
          return out;
        }
        function adjust() {
          var footer = document.getElementById("icp-beian");
          if (!footer) return;
          // Measure real ICP height and publish as CSS var for tabBar bottom
          var icpH = Math.ceil(footer.getBoundingClientRect().height) || 36;
          document.documentElement.style.setProperty("--icp-h", icpH + "px");
          footer.style.bottom = "0px";

          var tabs = visibleTabs();
          var tabH = 0;
          for (var i = 0; i < tabs.length; i++) {
            tabs[i].style.bottom = icpH + "px";
            tabH = Math.max(tabH, tabs[i].offsetHeight || 0);
          }
          // Reserve space for ICP always; add tabBar when present so content isn't hidden
          document.body.style.paddingBottom = icpH + tabH + "px";
        }
        function schedule() {
          adjust();
          requestAnimationFrame(adjust);
          setTimeout(adjust, 50);
          setTimeout(adjust, 300);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", schedule);
        } else {
          schedule();
        }
        window.addEventListener("hashchange", schedule);
        window.addEventListener("popstate", schedule);
        window.addEventListener("resize", schedule);
        window.addEventListener("orientationchange", schedule);
        new MutationObserver(schedule).observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["style", "class"]
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
