<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>生产进度追踪</title>
    <!--preload-links-->
    <!--app-context-->
    <style>
      /*
        Layout:
          - All pages: ICP fixed at very bottom
          - Tab pages (logged in): content → tabBar → ICP
          - Login / no tabBar: ICP only (tab switcher hidden)
      */
      :root {
        --icp-h: 36px;
      }
      body {
        padding-bottom: var(--icp-h);
      }
      .icp-beian {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        /* Low z-index: stays under every popup, mask, picker, toast and page-level fixed bar */
        z-index: 10;
        height: var(--icp-h);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        box-sizing: border-box;
        font-size: 12px;
        line-height: 1.4;
        color: #7d898b;
        background: #f1f4f3;
        border-top: 1px solid #e3e9e7;
        pointer-events: none;
      }
      .icp-beian a {
        color: #7d898b;
        text-decoration: none;
        pointer-events: auto;
      }
      /* Only lift tabBar when a real tabBar is present */
      html.has-uni-tabbar .uni-tabbar,
      html.has-uni-tabbar .uni-tabbar-bottom,
      html.has-uni-tabbar uni-tabbar {
        bottom: var(--icp-h) !important;
      }
      /* Login gate on pages/index/index: hide native tabBar */
      html.icp-hide-tabbar .uni-tabbar,
      html.icp-hide-tabbar .uni-tabbar-bottom,
      html.icp-hide-tabbar uni-tabbar,
      html.icp-hide-tabbar .uni-tabbar-border {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        height: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
        opacity: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <!-- Global ICP: always at page bottom on every route including login -->
    <footer id="icp-beian" class="icp-beian" aria-label="ICP备案">
      <a
        href="https://beian.miit.gov.cn/"
        target="_blank"
        rel="noopener noreferrer"
      >陕ICP备2026009527号-1</a>
    </footer>
    <script>
      (function () {
        var TAB_SEL = ".uni-tabbar, .uni-tabbar-bottom, uni-tabbar";
        var lastHide = null;
        var lastHasTab = null;
        var busy = false;
        var timer = null;

        function isLoginUi() {
          var nodes = document.querySelectorAll(".login-section");
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            var st = window.getComputedStyle(el);
            if (st.display === "none" || st.visibility === "hidden") continue;
            if (el.offsetHeight > 0 || el.offsetWidth > 0) return true;
          }
          return false;
        }

        function allTabNodes() {
          return document.querySelectorAll(TAB_SEL);
        }

        function visibleTabs() {
          var out = [];
          var nodes = allTabNodes();
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (el.getAttribute("data-icp-hidden") === "1") continue;
            var st = window.getComputedStyle(el);
            if (st.display === "none" || st.visibility === "hidden") continue;
            if (el.offsetHeight > 0) out.push(el);
          }
          return out;
        }

        function syncUniApi(hide) {
          try {
            if (typeof uni === "undefined") return;
            if (hide && typeof uni.hideTabBar === "function") {
              uni.hideTabBar({ animation: false });
            } else if (!hide && typeof uni.showTabBar === "function") {
              uni.showTabBar({ animation: false });
            }
          } catch (e) {}
        }

        function setLoginMode(hide) {
          if (lastHide === hide) return;
          lastHide = hide;
          document.documentElement.classList.toggle("icp-hide-tabbar", hide);
          var nodes = allTabNodes();
          for (var i = 0; i < nodes.length; i++) {
            if (hide) nodes[i].setAttribute("data-icp-hidden", "1");
            else nodes[i].removeAttribute("data-icp-hidden");
          }
          syncUniApi(hide);
        }

        function adjust() {
          if (busy) return;
          busy = true;
          try {
            var footer = document.getElementById("icp-beian");
            if (!footer) return;

            var icpH = Math.ceil(footer.getBoundingClientRect().height) || 36;
            document.documentElement.style.setProperty("--icp-h", icpH + "px");
            footer.style.bottom = "0px";

            var login = isLoginUi();
            setLoginMode(login);

            var tabs = login ? [] : visibleTabs();
            var hasTab = tabs.length > 0;
            if (lastHasTab !== hasTab) {
              lastHasTab = hasTab;
              document.documentElement.classList.toggle("has-uni-tabbar", hasTab);
            }

            var tabH = 0;
            for (var i = 0; i < tabs.length; i++) {
              if (tabs[i].style.display === "none") tabs[i].style.display = "";
              tabs[i].style.bottom = icpH + "px";
              tabH = Math.max(tabH, tabs[i].offsetHeight || 0);
            }

            var pad = icpH + (hasTab ? tabH : 0);
            if (document.body.style.paddingBottom !== pad + "px") {
              document.body.style.paddingBottom = pad + "px";
            }
          } finally {
            busy = false;
          }
        }

        function schedule() {
          adjust();
          requestAnimationFrame(adjust);
          clearTimeout(timer);
          timer = setTimeout(adjust, 80);
          setTimeout(adjust, 300);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", schedule);
        } else {
          schedule();
        }
        window.addEventListener("hashchange", schedule);
        window.addEventListener("popstate", schedule);
        window.addEventListener("resize", schedule);
        window.addEventListener("orientationchange", schedule);
        new MutationObserver(function () {
          if (busy) return;
          schedule();
        }).observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["style", "class"]
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
