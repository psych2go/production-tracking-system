name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            git config --global --add safe.directory /opt/pts

            cd /opt/pts
            git fetch origin
            git reset --hard origin/main

            # 后端
            cd server
            node <<'NODE'
            const crypto = require("crypto");
            const fs = require("fs");

            const envPath = ".env";
            const source = fs.existsSync(envPath)
              ? fs.readFileSync(envPath, "utf8")
              : fs.readFileSync(".env.example", "utf8");
            const lines = source.split(/\r?\n/);

            function getValue(key) {
              const line = lines.find((item) => item.startsWith(`${key}=`));
              return line ? line.slice(key.length + 1) : "";
            }

            function setValue(key, value) {
              const index = lines.findIndex((item) => item.startsWith(`${key}=`));
              if (index >= 0) lines[index] = `${key}=${value}`;
              else lines.push(`${key}=${value}`);
            }

            const insecureSecrets = new Set([
              "dev-secret",
              "test-secret",
              "your-jwt-secret-change-in-production",
            ]);
            const currentSecret = getValue("JWT_SECRET");
            if (currentSecret.length < 32 || insecureSecrets.has(currentSecret)) {
              setValue("JWT_SECRET", crypto.randomBytes(32).toString("hex"));
            }

            setValue("NODE_ENV", "production");
            setValue("HOST", "127.0.0.1");
            fs.writeFileSync(envPath, `${lines.filter(Boolean).join("\n")}\n`, { mode: 0o600 });
            fs.chmodSync(envPath, 0o600);
            NODE
            npm ci --include=dev
            DATABASE_URL="file:./dev.db" npx prisma migrate deploy
            DATABASE_URL="file:./dev.db" npx prisma generate
            npm run build
            export NODE_ENV=production
            node -e "import('./dist/config/index.js')"
            pm2 delete pts 2>/dev/null || true
            pm2 restart pts-api --update-env 2>/dev/null || pm2 start dist/server.js --name pts-api
            pm2 save

            # 前端
            cd ../client
            npm ci
            rm -rf dist/build/h5
            npm run build:h5
