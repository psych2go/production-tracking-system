name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            git config --global --add safe.directory /opt/pts

            cd /opt/pts
            git fetch origin
            git reset --hard origin/main

            # 后端
            cd server
            PRODUCTION_CLIENT_URL="https://www.gaokekao.cn" node scripts/prepare-production-env.cjs
            npm ci --include=dev
            DATABASE_URL="file:./dev.db" npx prisma migrate deploy
            DATABASE_URL="file:./dev.db" npx prisma generate
            npm run build
            export NODE_ENV=production
            node -e "import('./dist/config/index.js')"
            pm2 delete pts 2>/dev/null || true
            pm2 restart pts-api --update-env 2>/dev/null || pm2 start dist/server.js --name pts-api
            pm2 save

            # 前端
            cd ../client
            npm ci --include=dev
            rm -rf dist/build/h5-next
            UNI_OUTPUT_DIR="$PWD/dist/build/h5-next" npm run build:h5
            rm -rf dist/build/h5-previous
            if [ -d dist/build/h5 ]; then
              mv dist/build/h5 dist/build/h5-previous
            fi
            mv dist/build/h5-next dist/build/h5
            rm -rf dist/build/h5-previous
